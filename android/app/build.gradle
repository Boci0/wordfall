plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boci0.wordfall'
    compileSdk 36

    defaultConfig {
        applicationId 'com.boci0.wordfall'
        minSdk 24
        // 34 keeps windowSoftInputMode=adjustResize working without edge-to-edge inset code.
        targetSdk 34
        versionCode 8
        versionName '1.11.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('web')
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

// The game is the repo's own web build; copy it in instead of keeping a second copy.
tasks.register('copyWeb', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'game.js', 'style.css', 'words.js', 'assets/**'
    }
    into layout.buildDirectory.dir('web')
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'copyWeb'
}
